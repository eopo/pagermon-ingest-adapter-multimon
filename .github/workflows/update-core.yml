name: Update Core Dependency

on:
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:
    inputs:
      core_version:
        description: 'Core version to update to (e.g., 1.0.5)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: update-core-dependency
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve core version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.core_version || github.event.client_payload.core_version }}
        run: |
          VERSION="${REQUESTED_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid core version: '${REQUESTED_VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The dispatch arrives right after publishing, when npm cannot resolve the new version for a
      # few minutes, while the release asset (the same tarball as on npm) is downloadable immediately.
      # package.json keeps a plain version; only the lockfile `resolved` URL points to the asset, so
      # `npm ci` (CI, Docker build) downloads it without ever querying the registry for core.
      - name: Install core release
        env:
          CORE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install "https://github.com/eopo/pagermon-ingest-core/releases/download/v${CORE_VERSION}/pagermon-ingest-core-${CORE_VERSION}.tgz"
          npm pkg set "dependencies.@pagermon/ingest-core=${CORE_VERSION}"
          npm install --package-lock-only --offline

      # An App token is required: changes made with GITHUB_TOKEN do not trigger further workflows.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create Pull Request to main
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: bot/update-core-${{ steps.version.outputs.version }}
          title: 'deps(core): update @pagermon/ingest-core to v${{ steps.version.outputs.version }}'
          commit-message: 'deps(core): update @pagermon/ingest-core to v${{ steps.version.outputs.version }}'
          body: |
            Automated core dependency update after ingest-core release.

            - Source release: `v${{ steps.version.outputs.version }}`
            - Triggered by: `${{ github.event_name }}`

            Auto-merge is enabled; the PR merges once the required CI checks pass.
          labels: dependencies
          add-paths: |
            package.json
            package-lock.json

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
