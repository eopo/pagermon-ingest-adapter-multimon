name: Update Core Dependency

on:
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:
    inputs:
      core_version:
        description: 'Core version to update to (e.g., 1.0.5)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    concurrency:
      group: update-core-dependency
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Get core version
        id: version
        env:
          INPUT_CORE_VERSION: ${{ github.event.inputs.core_version }}
          DISPATCH_CORE_VERSION: ${{ github.event.client_payload.core_version }}
        run: |
          if [ -n "$INPUT_CORE_VERSION" ]; then
            VERSION="$INPUT_CORE_VERSION"
          else
            VERSION="$DISPATCH_CORE_VERSION"
          fi
          # Remove 'v' prefix for npm
          NPM_VERSION="${VERSION#v}"
          echo "core_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "npm_version=${NPM_VERSION}" >> $GITHUB_OUTPUT
          echo "Updating to core version: ${VERSION} (npm: ${NPM_VERSION})"

      - name: Wait for core package
        env:
          CORE_VERSION: ${{ steps.version.outputs.npm_version }}
        run: |
          for attempt in {1..30}; do
            if npm view \
              "@pagermon/ingest-core@${CORE_VERSION}" \
              version >/dev/null 2>&1; then
              echo "Core package available: ${CORE_VERSION}"
              exit 0
            fi
            echo "Waiting for core package (attempt ${attempt}/30)"
            sleep 10
          done
          echo "::error::Core package unavailable after 5 minutes: \
            @pagermon/ingest-core@${CORE_VERSION}"
          exit 1

      - name: Update core dependency
        env:
          CORE_VERSION: ${{ steps.version.outputs.npm_version }}
        run: |
          npm install \
            "@pagermon/ingest-core@${CORE_VERSION}" \
            --save-exact

      - name: Run tests
        run: npm test

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          base: main
          branch: bot/update-core-${{ steps.version.outputs.npm_version }}
          title: "deps(core): update @pagermon/ingest-core to ${{ steps.version.outputs.core_version }}"
          commit-message: "deps(core): update @pagermon/ingest-core to ${{ steps.version.outputs.core_version }}"
          body: |
            Automated core dependency update after ingest-core release.

            - Source release: `${{ steps.version.outputs.core_version }}`
            - Target branch: `main`
            - Triggered by: `${{ github.event_name }}`
          labels: |
            dependencies
            automerge
          add-paths: |
            package.json
            package-lock.json
